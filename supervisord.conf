[supervisord]
nodaemon=true
user=root

[program:rabbitmq]
command=/usr/sbin/rabbitmq-server
priority=1
autostart=true
autorestart=true

[program:firehose]
command=python 1_producer_firehose.py
directory=/app
priority=2
autostart=true
autorestart=true
startsecs=10

[program:consumer]
command=python 2_ai_core_consumer.py
directory=/app
priority=3
autostart=true
autorestart=true
startsecs=10

[program:flask]
command=python 3_web_server.py
directory=/app
priority=4
autostart=true
autorestart=true