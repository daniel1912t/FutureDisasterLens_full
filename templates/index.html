<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureDisasterLens AI</title>
  
  <!-- Polyfill process for Three.js -->
  <script>
    window.process = window.process || { env: { NODE_ENV: 'production' } };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <style>
    body {
      margin: 0;
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      width: 380px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .badge-demo { background: #b45309; color: #fef3c7; }
    .badge-live { background: #047857; color: #d1fae5; }
    h2 { margin: 0 0 16px 0; font-size: 1.1rem; color: #f8fafc; }
    .metric-row { margin-bottom: 12px; }
    .label { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
    .value { font-size: 14px; font-weight: 500; color: #f1f5f9; margin-top: 2px; }
    .countdown-val { color: #38bdf8; font-weight: 700; }
    ul { margin: 4px 0 0 0; padding-left: 18px; font-size: 13px; color: #cbd5e1; }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <div id="status-badge" class="badge badge-demo">Initializing...</div>
    <h2 id="threat-title">Scanning Telemetry...</h2>

    <div class="metric-row">
      <div class="label">Target Location</div>
      <div id="threat-location" class="value">--</div>
    </div>

    <div class="metric-row">
      <div class="label">Impending Forecast Window</div>
      <div id="threat-countdown" class="value countdown-val">--</div>
      <div id="threat-eta" style="font-size: 11px; color: #64748b; margin-top: 2px;">--</div>
    </div>

    <div class="metric-row" style="display: flex; gap: 24px;">
      <div>
        <div class="label">Severity</div>
        <div id="threat-severity" class="value">--</div>
      </div>
      <div>
        <div class="label">Forecast Confidence</div>
        <div id="threat-prob" class="value">--</div>
      </div>
    </div>

    <div class="metric-row">
      <div class="label">Anticipated Cascading Impacts</div>
      <ul id="threat-impacts">
        <li>Evaluating sensor telemetry...</li>
      </ul>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // Three.js 3D Globe Visualization
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 240;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // Globe
    const globeGeometry = new THREE.SphereGeometry(80, 64, 64);
    const globeMaterial = new THREE.MeshPhongMaterial({
      color: 0x1e293b,
      emissive: 0x0f172a,
      wireframe: true
    });
    const globe = new THREE.Mesh(globeGeometry, globeMaterial);
    scene.add(globe);

    // Threat Marker
    const markerGeometry = new THREE.SphereGeometry(2.5, 16, 16);
    const markerMaterial = new THREE.MeshBasicMaterial({ color: 0xef4444 });
    const threatMarker = new THREE.Mesh(markerGeometry, markerMaterial);
    scene.add(threatMarker);

    // Lighting
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(100, 100, 100);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x334155));

    function latLonToVector3(lat, lon, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -(radius * Math.sin(phi) * Math.cos(theta)),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function formatFutureCountdown(targetIso) {
      const targetTime = new Date(targetIso).getTime();
      const now = new Date().getTime();
      const diffMs = targetTime - now;

      if (diffMs <= 0) {
        return "Peak Window Active / Imminent";
      }

      const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
      const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      return `ETA: In ~${diffHours}h ${diffMins}m`;
    }

    async function fetchForecast() {
      try {
        const res = await fetch('/api/latest_threat');
        if (!res.ok) return;
        const data = await res.json();

        // Update Badge
        const badge = document.getElementById('status-badge');
        if (data.is_demo) {
          badge.className = 'badge badge-demo';
          badge.innerText = 'PREVIEW / DEMO FORECAST';
        } else {
          badge.className = 'badge badge-live';
          badge.innerText = 'AI VERIFIED LIVE PREDICTION';
        }

        // Update Card Details
        document.getElementById('threat-title').innerText = data.primary_threat;
        document.getElementById('threat-location').innerText = data.location;
        document.getElementById('threat-countdown').innerText = formatFutureCountdown(data.time_of_event);
        document.getElementById('threat-eta').innerText = `Forecast Target: ${data.time_of_event}`;
        document.getElementById('threat-severity').innerText = data.severity;
        document.getElementById('threat-prob').innerText = data.probability;

        const impactList = document.getElementById('threat-impacts');
        impactList.innerHTML = '';
        (data.cascading_effects || []).forEach(effect => {
          const li = document.createElement('li');
          li.innerText = effect;
          impactList.appendChild(li);
        });

        // Reposition 3D Marker
        if (data.lat !== undefined && data.lon !== undefined) {
          const pos = latLonToVector3(data.lat, data.lon, 81.5);
          threatMarker.position.copy(pos);
        }
      } catch (e) {
        console.error("Telemetry fetch error:", e);
      }
    }

    fetchForecast();
    setInterval(fetchForecast, 10000);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
